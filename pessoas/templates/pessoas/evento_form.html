{% extends "base.html" %}

{% block title %}{{ titulo }} - SIGTEC{% endblock %}

{% block content %}
<h4 class="mb-4">{{ titulo }}</h4>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Título</label>
                    {{ form.titulo }}
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Tipo</label>
                    {{ form.tipo }}
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Pessoa</label>
                    {{ form.pessoa }}
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Data/Hora Início</label>
                    {{ form.dt_inicio }}
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Data/Hora Fim</label>
                    {{ form.dt_fim }}
                </div>
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <div class="form-check">
                        {{ form.geral }}
                        <label class="form-check-label ms-2">Evento geral (visível para todos)</label>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                {{ form.descricao }}
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Salvar
                </button>
                <a href="{% url 'pessoas:agenda' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
