{% extends "base.html" %}

{% block title %}Atribuir Cargo - SIGTEC{% endblock %}

{% block content %}
<h4 class="mb-4">Atribuir Cargo - {{ p.nome }}</h4>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Cargo</label>
                    {{ form.cargo }}
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Data Início</label>
                    {{ form.dt_inicio }}
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Data Fim</label>
                    {{ form.dt_fim }}
                </div>
                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <div class="form-check">
                        {{ form.atual }}
                        <label class="form-check-label ms-2">Atual</label>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Salvar
                </button>
                <a href="{% url 'pessoas:pessoa_detalhe' p.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
