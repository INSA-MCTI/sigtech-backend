{% extends "base.html" %}

{% block title %}Upload de Arquivo - SIGTEC{% endblock %}

{% block content %}
<h4 class="mb-4">Upload de Arquivo - {{ p.nome }}</h4>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo</label>
                    {{ form.tipo }}
                </div>
                <div class="col-md-8 mb-3">
                    <label class="form-label">Descrição</label>
                    {{ form.descricao }}
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Arquivo</label>
                {{ form.arquivo }}
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-upload"></i> Enviar
                </button>
                <a href="{% url 'pessoas:pessoa_detalhe' p.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
