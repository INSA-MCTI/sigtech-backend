
[project]
name = "sigtech-backend"
version = "0.1.0"
description = "Backend do SIGTech"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "mysqlclient>=2.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ["**/migrations/**", "manage.py",
    "config/settings.py",]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
addopts = "-p no:warnings"

[tool.taskipy.tasks]
run = "python manage.py runserver"
test = "pytest -s -x --cov=config --cov-report=term-missing -vv"
pre_test = "task lint"
post_test = "coverage report"

lint = "ruff check . --fix"
format = "ruff format ."
pre_format = "ruff check . --fix"
check = "ruff check ."
